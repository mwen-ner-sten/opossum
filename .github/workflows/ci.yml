name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Static checks never launch Electron, so skip the binary download entirely.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  verify:
    name: Tests, build, end-to-end, portable exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
      - name: Restore Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # Unit and integration tests mock ping.exe and use Windows sockets.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Compute build number (commit count)
        id: buildnum
        shell: bash
        run: |
          count=$(git rev-list --count HEAD)
          sha=$(git rev-parse --short HEAD)
          version=$(node -p "require('./package.json').version")
          echo "BUILD_NUMBER=$count" >> "$GITHUB_ENV"
          echo "label=$version.$count-$sha" >> "$GITHUB_OUTPUT"
      - run: npm run build
      - name: End-to-end (Electron + Playwright)
        run: npx playwright test
      - name: Portable build
        run: npx electron-builder --win portable --x64 --publish never
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opossum-portable-${{ steps.buildnum.outputs.label }}
          path: |
            release/*.exe
            test-results/
          if-no-files-found: ignore
