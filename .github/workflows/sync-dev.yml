name: Sync main into dev

# After a release lands on main (version bump, changelog), open a PR that
# carries it back into dev so the two branches never drift.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Open or update the back-merge PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ahead=$(git rev-list --count origin/dev..origin/main)
          if [ "$ahead" = "0" ]; then
            echo "dev already contains main; nothing to sync."
            exit 0
          fi
          # Never use main itself as the PR head: delete-branch-on-merge would remove it.
          head=sync/main-into-dev
          git push --force origin origin/main:refs/heads/$head
          existing=$(gh pr list --base dev --head "$head" --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --base dev --head "$head"               --title "chore: sync main into dev"               --body "Automated back-merge of release commits from \`main\` into \`dev\`."
            existing=$(gh pr list --base dev --head "$head" --state open --json number --jq '.[0].number')
          fi
          # Print the failure reason so a silent "merge manually" never hides the cause.
          if ! output=$(gh pr merge "$existing" --merge --auto 2>&1); then
            echo "::warning::auto-merge could not be enabled on #$existing: $output"
          fi
