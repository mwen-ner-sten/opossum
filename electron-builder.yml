appId: com.mikewennersten.opossum
productName: OPOSSUM
copyright: Copyright © 2026 Mike Wennersten
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
npmRebuild: true
win:
  icon: build/icon.ico
  executableName: opossum
  artifactName: OPOSSUM-${version}-portable-${arch}.${ext}
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: OPOSSUM-${version}-portable-${arch}.${ext}
publish: null
